# =====================================================================
# rag-server 默认配置。所有环境相关值使用 ${ENV_VAR:默认} 占位；
# 密钥永远只有环境变量占位形式，不落真实值。本地启动示例见 application-example.yaml。
# =====================================================================
server:
  port: 8080

spring:
  application:
    name: rag-server

  # 实现计划环境适配：本机 JDK 17，虚拟线程（Java 21 特性）不启用，
  # ingestion worker 与 SSE 均为固定大小线程池，行为等价。
  threads:
    virtual:
      enabled: false

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:rag}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:rag}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      # 表结构唯一事实来源是 Flyway 迁移；JPA 只做映射校验，绝不自动改表
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # elasticsearch-java 客户端由 Boot 自动装配（ElasticsearchClientAutoConfiguration）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: rag

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 本机/可信内网单用户部署（路线 §7），health 展示 db/es/minio/ragModels 分项便于排障
      show-details: always

rag:
  models:
    # 启动时向 embedding 服务发一次探活并校验维度；模型服务晚于应用启动的本地场景可置 false
    startup-check: ${RAG_MODELS_STARTUP_CHECK:true}
    chat:
      base-url: ${CHAT_MODEL_BASE_URL:}
      api-key: ${CHAT_MODEL_API_KEY:}
      model-name: ${CHAT_MODEL_NAME:qwen2.5-7b-instruct}
      temperature: 0.2
      timeout-seconds: 120
      max-history-messages: 8
    embedding:
      base-url: ${EMBEDDING_BASE_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model-name: ${EMBEDDING_MODEL_NAME:bge-m3}
      dimensions: 1024
      timeout-seconds: 30
  retrieval:
    top-k: 6
    min-score: 0.30
    max-context-chars: 6000
    # 检索模式：VECTOR（仅向量，第一轮基线）/ HYBRID（BM25+向量 RRF 融合）/ HYBRID_RERANK（融合+重排）
    mode: ${RAG_RETRIEVAL_MODE:HYBRID_RERANK}
    rrf:
      # RRF 常数；融合分 = Σ 1/(k+rank)，再按 2/(k+1) 归一化到 (0,1]
      k: 60
      # 各通道候选数上限：重排成本随候选数增长，需收敛（实测 50 篇 ≈0.5s）
      candidate-limit: 30
    rerank:
      # DashScope 原生重排端点（注意：不是 OpenAI 兼容路径 /compatible-mode/v1，后者返回 404）
      base-url: ${RERANK_MODEL_BASE_URL:}
      api-key: ${RERANK_MODEL_API_KEY:}
      model-name: ${RERANK_MODEL_NAME:qwen3.7-text-rerank}
      timeout-seconds: 10
      # true=重排失败回退融合顺序（问答可用性优先，且运行会标注「已降级」）
      degrade-on-failure: true
    refusal:
      # 证据不足即拒答并清空引用（R2-A1）；关闭仅用于与第一轮行为做对照
      enabled: ${RAG_REFUSAL_ENABLED:true}
      # 双口径阈值：重排生效时用 rerank 阈值（默认模式）；降级/未启用重排时用 cosine 阈值
      # （余弦口径区分度弱，只能过滤明显不相关）。
      # rerank 阈值基于当前 qwen3.7-text-rerank + 当前 eval corpus 校准（R4.1 sweep，
      # 依据 docs/round4/04-R4.1评测与校准.md §B）。
      # ⚠ 更换 rerank 模型或语料分布后必须重新校准，不能直接复用该数值。
      rerank-threshold: ${RAG_REFUSAL_RERANK_THRESHOLD:0.75}
      cosine-threshold: ${RAG_REFUSAL_COSINE_THRESHOLD:0.30}
    answerability:
      # R4：证据充分性判定（低分直拒 → 其余交给 Judge；数据依据 docs/round4/01-Baseline分析.md）
      enabled: ${RAG_ANSWERABILITY_ENABLED:true}
      # Judge 失败时的降级：false=退回旧阈值行为放行（标注 JUDGE_DEGRADED）；true=保守拒答
      fail-closed: ${RAG_ANSWERABILITY_FAIL_CLOSED:false}
      judge-timeout-seconds: ${RAG_ANSWERABILITY_JUDGE_TIMEOUT_SECONDS:15}
      # R4.1 bulkhead 并发闸门：同时进入 Judge 模型调用的判定数上限；容量耗尽按 OVERLOADED 快速降级
      max-concurrent-judges: ${RAG_ANSWERABILITY_MAX_CONCURRENT_JUDGES:4}
      # 获取 Judge 名额的最长等待（毫秒）；耗尽仍未获得名额 → JUDGE_DEGRADED(OVERLOADED)
      bulkhead-wait-ms: ${RAG_ANSWERABILITY_BULKHEAD_WAIT_MS:500}
      # R4.1：judge-timeout-seconds 同时作为 Judge HTTP connect/read timeout（单一超时语义）
    query-rewrite:
      # R6-C：history-aware query rewrite（检索前把依赖历史的当前问题改写为独立查询；
      # 仅影响检索查询，Judge/Generation 仍用原始问题；失败回退原始查询）
      enabled: ${RAG_QUERY_REWRITE_ENABLED:true}
      # rewrite 模型 HTTP connect/read timeout（秒，单一超时语义；独立于生成与 Judge 超时）
      timeout-seconds: ${RAG_QUERY_REWRITE_TIMEOUT_SECONDS:5}
      # 改写查询最大长度（字符）；超长视为非法输出并回退原始查询
      max-query-length: 200
      # rewrite 提示词携带的最大历史轮数（沿用项目 history window 的收敛约定）
      max-history-turns: 4
  ingestion:
    worker-threads: 2
    max-upload-size-mb: 50
    # PDF 解析器：pdfbox（默认，文本层）| mineru（远端 mineru-api，复杂版面/扫描件 OCR）
    pdf-parser: ${RAG_INGESTION_PDF_PARSER:pdfbox}
    mineru-base-url: ${MINERU_BASE_URL:}
    # 扫描件 OCR 较慢，超时按分钟级给
    mineru-timeout-seconds: ${MINERU_TIMEOUT_SECONDS:600}
  elasticsearch:
    # 分块正文分析器；ES 镜像未装 IK 插件时改 standard（见 docker-compose.yml 注释）
    content-analyzer: ik_max_word

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [rid=%X{requestId}] %logger{40} - %msg%n"
  level:
    com.rag: INFO
