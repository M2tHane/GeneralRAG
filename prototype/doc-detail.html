<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档详情 · 通用知识问答 RAG 原型</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ---------- 页面私有布局：固定高度工作区，Tabs 内容各自内部滚动 ---------- */
  .content { display: flex; overflow: hidden; }
  .content .content-inner { flex: 1 1 auto; min-height: 0; width: 100%; }

  .page-header { flex-wrap: wrap; }
  .meta-line { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .meta-line .meta-text { font-size: 13px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex: none; }
  .tab {
    border: none; background: none; padding: 9px 14px; font-size: 14px; font-family: inherit;
    color: var(--muted-foreground); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--foreground); }
  .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

  .tab-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .tab-panel[hidden] { display: none !important; }

  /* 分块预览面板：数据区不足一页时中间留白伸展，分页停靠面板底部（底边距由 .content 的 24px 提供） */
  #panel-chunks { display: flex; flex-direction: column; overflow: hidden; }
  #panel-chunks .chunks-table { flex: 0 1 auto; min-height: 0; overflow: auto; }
  #panel-chunks .panel-spacer { flex: 1 1 auto; min-height: 12px; }
  #panel-chunks .pagination { flex: none; margin-top: 0; }

  /* ---------- 解析文本阅读视图 ---------- */
  .rd-lead { font-size: 13px; color: var(--muted-foreground); margin: 0 0 16px; }
  .rd { max-width: 820px; }
  .rd-h2 { font-size: 17px; line-height: 24px; font-weight: 600; margin: 24px 0 8px; }
  .rd-h3 { font-size: 15px; line-height: 22px; font-weight: 600; margin: 16px 0 6px; }
  .rd-h4 { font-size: 14px; line-height: 20px; font-weight: 600; margin: 12px 0 4px; }
  .rd .rd-h2:first-child, .rd .rd-h3:first-child { margin-top: 0; }
  .rd-p { font-size: 15px; line-height: 24px; margin: 0 0 12px; word-break: break-word; }
  .page-meta { font-size: 12px; color: var(--muted-foreground); font-weight: 400; margin-left: 8px; white-space: nowrap; }

  /* ---------- 分块表格 ---------- */
  .th-center, .td-center { text-align: center; }
  td.td-title { max-width: 300px; }
  tr[data-chunk] { cursor: pointer; }
  tr[data-chunk] .exp-btn svg { transition: transform 0.15s; }
  tr[data-chunk].expanded .exp-btn svg { transform: rotate(90deg); }
  tr.detail-tr td { background: var(--surface-subtle); padding: 12px 16px 16px 56px; }
  .chunk-full { font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; max-width: 860px; }
  @keyframes chunkHl { 0%, 55% { background: var(--primary-subtle); } 100% { background: transparent; } }
  tr.chunk-hl td { animation: chunkHl 2.2s ease-out; }

  /* ---------- 标题路径编号修复对照（R2-T1） ---------- */
  .chunks-fix { flex: none; }
  .path-fix {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface-subtle); padding: 10px 14px 12px; margin-bottom: 12px;
  }
  .path-fix .pf-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .path-fix .pf-row { display: flex; gap: 10px; align-items: baseline; line-height: 22px; }
  .path-fix .pf-label { flex: none; width: 56px; font-size: 14px; color: var(--muted-foreground); }
  .path-fix .pf-path, .fp-mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 14px; color: var(--foreground); word-break: break-all;
  }
  /* 仅标记被删除的重复编号片段，避免把整条路径画成已废弃 */
  .path-fix .pf-dup {
    color: var(--destructive); text-decoration: line-through;
    text-decoration-color: var(--destructive);
  }
  .path-fix .pf-row.after .pf-label { color: var(--foreground); font-weight: 500; }
  .path-fix .pf-note { font-size: 13px; line-height: 20px; color: var(--muted-foreground); margin-top: 8px; }

  /* ---------- 基本信息（定义列表，不逐项套 Card） ---------- */
  .info-section { max-width: 760px; }
  .info-section + .info-section { margin-top: 28px; }
  .info-section h2 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
  .dl { display: grid; grid-template-columns: 140px 1fr; row-gap: 12px; column-gap: 16px; }
  .dl dt { font-size: 14px; color: var(--muted-foreground); }
  .dl dd { margin: 0; font-size: 14px; word-break: break-all; }
  /* 共享 .kv 默认 150px，与本页 .dl 对齐（本页作用域内覆盖，不改公共样式） */
  .info-section .kv { grid-template-columns: 140px 1fr; row-gap: 12px; }
  .strategy-note { font-size: 13px; color: var(--muted-foreground); line-height: 20px; margin-top: 4px; }

  .stage-record { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage-record li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
  .stage-record .st-ic { width: 18px; text-align: center; flex: none; line-height: 20px; }
  .stage-record .st-body { flex: 1; min-width: 0; }
  .stage-record li.done .st-ic { color: var(--success); }
  .stage-record li.done .st-time { font-size: 13px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; margin-left: 12px; }
  .stage-record li.running { color: var(--primary); font-weight: 500; }
  .stage-record li.fail { color: var(--destructive); }
  .stage-record li.fail .st-note { font-weight: 400; margin-top: 2px; line-height: 20px; }
  .stage-record li.pending { color: var(--muted-foreground); }

  /* ---------- More 菜单 ---------- */
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; min-width: 148px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-pop); padding: 4px; display: flex; flex-direction: column;
  }
  .menu[hidden] { display: none; }
  .menu-item {
    border: none; background: none; text-align: left; font-size: 14px; font-family: inherit;
    padding: 8px 12px; border-radius: 4px; cursor: pointer; color: var(--foreground);
  }
  .menu-item:hover { background: var(--muted); }
  .menu-item.danger { color: var(--destructive); }
  .menu-item.danger:hover { background: var(--destructive-bg); }

  .impact-list { margin: 0; padding-left: 18px; font-size: 14px; line-height: 24px; }

  /* ---------- 加载骨架 ---------- */
  .sk-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  @media (max-width: 640px) {
    td.td-title { max-width: 160px; }
    .dl, .info-section .kv { grid-template-columns: 112px 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开导航">☰</button>
      <div class="crumb">
        <a href="kb.html">知识库</a>
        <span>/</span>
        <a id="crumb-kb" href="docs.html"></a>
        <span id="crumb-sep" style="display:none">/</span>
        <b id="crumb-doc"></b>
      </div>
    </header>
    <main class="content">
      <div class="content-inner">
        <a class="back-link" id="back-link" href="docs.html" style="visibility:hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          返回文档列表
        </a>
        <div id="view"></div>
      </div>
    </main>
  </div>
</div>

<script src="ui.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var SEQ = MockUtil.stageSeq; // ['解析','清洗','分块','向量化','入库']

  var params = new URLSearchParams(location.search);
  var docId = params.get('doc');
  var chunkParam = params.get('chunk');
  var doc = docId ? MockUtil.doc(docId) : null;
  var kbId = null;
  if (doc) {
    Object.keys(MockData.documents).some(function (k) {
      if (MockData.documents[k].some(function (d) { return d.id === doc.id; })) { kbId = k; return true; }
      return false;
    });
  }

  var state = { tab: 'text', page: 1, pageSize: 10, expanded: {}, demoLong: false };

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function fmtSize(kb) { return kb < 1024 ? kb + ' KB' : (kb / 1024).toFixed(1) + ' MB'; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function kbName() { var k = MockUtil.kb(kbId); return k ? k.name : ''; }

  function currentChunks() {
    var base = MockUtil.chunksOf(doc.id);
    if (!state.demoLong || !base.length) return base;
    var list = base.map(function (c) { return Object.assign({}, c); });
    var root = base[0].titlePath.split(' > ')[0];
    list.push({
      id: doc.id + '-demo-path', seq: list.length + 1,
      titlePath: '支付网关服务架构说明 > 8. 附录 > 8.1 渠道接入配置说明 > 8.1.2 微信支付渠道参数与证书轮换操作细则（含备份与灰度方案） > 8.1.2.3 商户证书与 API 密钥的年度轮换流程、双证书并行期注意事项与回滚预案',
      page: doc.format === 'pdf' ? (doc.pages || 1) : null,
      chars: 96,
      text: '该小节为长标题路径样例，用于验证表格标题路径截断与阅读视图多级标题换行，内容无业务含义。'
    });
    var longText = '证书轮换操作必须在变更窗口内完成，执行前确认双证书并行期配置已生效，避免出现单证书失效导致的签名验签失败。每完成一步需要在变更单中记录执行时间与结果，出现验签失败率上升时立即回滚到上一版证书并通知值班同学排查影响范围。';
    list.push({
      id: doc.id + '-demo-text', seq: list.length + 2,
      titlePath: root + ' > 9. 长文本样例',
      page: doc.format === 'pdf' ? (doc.pages || 1) : null,
      chars: longText.length, text: longText
    });
    return list;
  }

  function stageTimes(doneCount) {
    var base = doc._retryBase ? new Date(doc._retryBase) : new Date(doc.uploadedAt.replace(' ', 'T'));
    var offs = [2, 6, 11, 17, 20];
    var out = [];
    for (var i = 0; i < doneCount; i++) out.push(fmtDate(new Date(base.getTime() + offs[i] * 60000)));
    return out;
  }

  function stageRecord() {
    var rec = [];
    var doneCount;
    if (doc.status === 'completed') doneCount = 5;
    else if (doc.status === 'failed') doneCount = Math.max(0, SEQ.indexOf(doc.stage));
    else if (doc.progressDone) doneCount = doc.progressDone.length;
    else doneCount = 0;
    var times = stageTimes(doneCount);
    for (var i = 0; i < SEQ.length; i++) {
      if (i < doneCount) rec.push({ name: SEQ[i], st: 'done', time: times[i] });
      else if (doc.status === 'failed' && SEQ[i] === doc.stage) rec.push({ name: SEQ[i], st: 'fail', note: doc.failureReason || '原因未获取' });
      else if (doc.status !== 'completed' && doc.status !== 'failed' && SEQ[i] === doc.stage) rec.push({ name: SEQ[i], st: 'running' });
      else rec.push({ name: SEQ[i], st: 'pending' });
    }
    return rec;
  }

  /* ---------- 加载骨架 ---------- */
  function showLoading() {
    document.getElementById('view').innerHTML =
      '<div class="page-header"><div class="grow">' +
        '<div class="skeleton skeleton-line" style="width:320px;height:22px"></div>' +
        '<div class="skeleton skeleton-line" style="width:260px;margin-top:10px"></div>' +
      '</div></div>' +
      '<div class="sk-tabs">' +
        '<div class="skeleton skeleton-line" style="width:72px;height:14px"></div>' +
        '<div class="skeleton skeleton-line" style="width:72px;height:14px"></div>' +
        '<div class="skeleton skeleton-line" style="width:72px;height:14px"></div>' +
      '</div>' +
      '<div class="skeleton" style="height:220px;margin-top:16px"></div>';
  }

  /* ---------- 错误态（docId 无效） ---------- */
  function renderErrorState() {
    document.getElementById('back-link').style.visibility = 'hidden';
    document.getElementById('crumb-doc').textContent = '文档不存在';
    document.getElementById('crumb-kb').style.display = 'none';
    var sep = document.getElementById('crumb-sep');
    if (sep) sep.style.display = 'none';
    document.getElementById('view').innerHTML =
      '<div class="error-state">' +
        '<div class="t">未找到文档</div>' +
        '<div class="d">文档标识 ' + esc(docId || '（空）') + ' 不存在或已被删除。</div>' +
        '<div class="flex" style="justify-content:center">' +
          '<a class="btn btn-outline" href="kb.html">返回知识库列表</a>' +
          '<a class="btn btn-primary" href="index.html">回到原型首页</a>' +
        '</div>' +
      '</div>';
  }

  /* ---------- 页头 ---------- */
  function statusBadge() {
    var m = MockUtil.statusMeta(doc.status);
    return '<span class="badge ' + m.cls + '"><span class="dot"></span>' + esc(m.label) + '</span>';
  }

  function renderHeader() {
    var failed = doc.status === 'failed';
    var actions = '';
    if (failed) {
      actions += '<button class="btn btn-primary" id="btn-retry">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>' +
        '重试</button>';
    }
    actions +=
      '<div class="menu-wrap">' +
        '<button class="icon-btn" id="more-btn" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作">⋯</button>' +
        '<div class="menu" id="more-menu" role="menu" hidden>' +
          '<button class="menu-item danger" role="menuitem" id="btn-delete">删除文档</button>' +
        '</div>' +
      '</div>';

    document.getElementById('view').innerHTML =
      '<div class="page-header">' +
        '<div class="grow">' +
          '<h1>' + esc(doc.name) + '</h1>' +
          '<div class="meta-line">' + statusBadge() +
            '<span class="meta-text">' + esc(doc.format.toUpperCase()) + ' · ' + fmtSize(doc.sizeKB) + ' · 上传于 ' + esc(doc.uploadedAt) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="actions">' + actions + '</div>' +
      '</div>' +
      '<div class="tabs" role="tablist" aria-label="文档内容视图">' +
        '<button class="tab" role="tab" id="tab-text" aria-controls="panel-text" aria-selected="' + (state.tab === 'text') + '" tabindex="' + (state.tab === 'text' ? 0 : -1) + '">解析文本</button>' +
        '<button class="tab" role="tab" id="tab-chunks" aria-controls="panel-chunks" aria-selected="' + (state.tab === 'chunks') + '" tabindex="' + (state.tab === 'chunks' ? 0 : -1) + '">分块预览</button>' +
        '<button class="tab" role="tab" id="tab-info" aria-controls="panel-info" aria-selected="' + (state.tab === 'info') + '" tabindex="' + (state.tab === 'info' ? 0 : -1) + '">基本信息</button>' +
      '</div>' +
      '<section class="tab-panel" id="panel-text" role="tabpanel" aria-labelledby="tab-text" tabindex="0"' + (state.tab === 'text' ? '' : ' hidden') + '></section>' +
      '<section class="tab-panel" id="panel-chunks" role="tabpanel" aria-labelledby="tab-chunks" tabindex="0"' + (state.tab === 'chunks' ? '' : ' hidden') + '>' +
        '<div class="chunks-fix" id="chunks-fix"></div>' +
        '<div class="table-wrap chunks-table" id="chunks-table"></div>' +
        '<div class="panel-spacer"></div>' +
        '<nav class="pagination" id="chunks-pagination" aria-label="分块列表分页"></nav>' +
      '</section>' +
      '<section class="tab-panel" id="panel-info" role="tabpanel" aria-labelledby="tab-info" tabindex="0"' + (state.tab === 'info' ? '' : ' hidden') + '></section>';

    var back = document.getElementById('back-link');
    back.style.visibility = 'visible';
    back.href = 'docs.html?kb=' + encodeURIComponent(kbId);
    var crumbKb = document.getElementById('crumb-kb');
    crumbKb.href = 'docs.html?kb=' + encodeURIComponent(kbId);
    crumbKb.textContent = kbName();
    document.getElementById('crumb-sep').style.display = '';
    document.getElementById('crumb-doc').textContent = doc.name;
    document.title = doc.name + ' · 通用知识问答 RAG 原型';

    bindHeaderActions();
    bindTabs();
    renderActiveTab();
  }

  function bindHeaderActions() {
    var retry = document.getElementById('btn-retry');
    if (retry) retry.addEventListener('click', onRetry);

    var moreBtn = document.getElementById('more-btn');
    var menu = document.getElementById('more-menu');
    moreBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.hidden;
      menu.hidden = !open;
      moreBtn.setAttribute('aria-expanded', String(open));
    });
    document.getElementById('btn-delete').addEventListener('click', onDelete);
  }

  function bindTabs() {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    tabs.forEach(function (t) {
      t.addEventListener('click', function () { showTab(t.id.replace('tab-', '')); });
    });
    document.querySelector('.tabs').addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var idx = tabs.findIndex(function (t) { return t.getAttribute('aria-selected') === 'true'; });
      var next = e.key === 'ArrowRight' ? (idx + 1) % tabs.length : (idx - 1 + tabs.length) % tabs.length;
      showTab(tabs[next].id.replace('tab-', ''));
      tabs[next].focus();
    });
  }

  function showTab(name) {
    state.tab = name;
    ['text', 'chunks', 'info'].forEach(function (k) {
      document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === name));
      document.getElementById('tab-' + k).tabIndex = k === name ? 0 : -1;
      document.getElementById('panel-' + k).hidden = k !== name;
    });
    renderActiveTab();
  }

  function renderActiveTab() {
    if (state.tab === 'text') renderTextTab();
    else if (state.tab === 'chunks') renderChunksTab();
    else renderInfoTab();
  }

  /* ---------- Tab 1：解析文本 ---------- */
  function stageLineHTML() {
    var doneCount = doc.progressDone ? doc.progressDone.length : 0;
    var parts = SEQ.map(function (s, i) {
      if (i < doneCount) return '<span class="done">' + s + ' ✓</span>';
      if (doc.status !== 'completed' && doc.status !== 'failed' && s === doc.stage) return '<span class="running">' + s + '…</span>';
      return '<span>' + s + '</span>';
    });
    return '<div class="stage-line">' + parts.join('<span class="stage-sep">→</span>') + '</div>';
  }

  function readingViewHTML(chunks) {
    var prev = [];
    var html = '<p class="rd-lead">以下为清洗后的全文预览，按标题结构组织（共 ' + chunks.length + ' 块' + (doc.format === 'pdf' ? '，页码为原文页码' : '') + '）。</p><div class="rd">';
    chunks.forEach(function (c) {
      var segs = c.titlePath.split(' > ');
      var common = 0;
      while (common < prev.length && common < segs.length && prev[common] === segs[common]) common++;
      for (var i = Math.max(1, common); i < segs.length; i++) {
        var lvl = Math.min(i, 3);
        var tag = lvl === 1 ? 'h2' : lvl === 2 ? 'h3' : 'h4';
        var pageMeta = (i === segs.length - 1 && doc.format === 'pdf' && c.page)
          ? '<span class="page-meta">第 ' + c.page + ' 页</span>' : '';
        html += '<' + tag + ' class="rd-h' + lvl + '">' + esc(segs[i]) + pageMeta + '</' + tag + '>';
      }
      html += '<p class="rd-p">' + esc(c.text) + '</p>';
      prev = segs;
    });
    return html + '</div>';
  }

  function renderTextTab() {
    var el = document.getElementById('panel-text');
    if (doc.status === 'failed') {
      el.innerHTML =
        '<div class="alert alert-error">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>' +
          '<div><b>处理失败（' + esc(doc.stage) + '阶段）</b>' +
          '<div class="mt-8">' + esc(doc.failureReason || '原因未获取') + '</div>' +
          '<div class="mt-8">可在页头点击「重试」重新提交处理任务。</div></div>' +
        '</div>';
      return;
    }
    if (doc.status !== 'completed') {
      var label = MockUtil.statusMeta(doc.status).label;
      el.innerHTML =
        '<div class="alert alert-info">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>' +
          '<div><b>' + (doc.status === 'queued' ? '排队中，尚未开始处理。' : '处理进行中，当前阶段：' + label + '。') + '</b>' +
          '<div class="mt-8">处理完成后，此处展示清洗后的全文。</div>' +
          (doc.status === 'queued' ? '' : stageLineHTML()) +
          '</div>' +
        '</div>';
      return;
    }
    var chunks = currentChunks();
    if (!chunks.length) {
      el.innerHTML =
        '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' +
          '<div class="t">暂无解析文本预览</div>' +
          '<div class="d">原型未为该文档预置解析文本演示数据（仅部分文档含完整分块），不代表产品能力缺失。</div>' +
        '</div>';
      return;
    }
    el.innerHTML = readingViewHTML(chunks);
  }

  /* ---------- Tab 2：分块预览 ---------- */
  // R2-T1：标题路径编号修复对照。现有分块数据均为修复后路径，本区块显式展示修复前后，
  // 避免「修好了但看不出来」——表中不再出现重复编号本身就是修复后的结果。
  function pathFixHTML() {
    var demo = MockData.titlePathFixDemo;
    if (!demo) return '';
    // 从 before/after 中找出被删除的片段（重复编号），只标记该片段而非整条路径
    var before = demo.before, after = demo.after;
    var i = 0, max = Math.min(before.length, after.length);
    while (i < max && before[i] === after[i]) i++;
    var j = 0;
    while (j < max - i && before[before.length - 1 - j] === after[after.length - 1 - j]) j++;
    var beforeHTML = i + j >= before.length
      ? esc(before)
      : esc(before.slice(0, i)) + '<span class="pf-dup">' + esc(before.slice(i, before.length - j)) + '</span>' + esc(before.slice(before.length - j));
    return '<div class="path-fix">' +
      '<div class="pf-title">标题路径修复前后对照</div>' +
      '<div class="pf-row before"><span class="pf-label">修复前</span><span class="pf-path">' + beforeHTML + '</span></div>' +
      '<div class="pf-row after"><span class="pf-label">修复后</span><span class="pf-path">' + esc(after) + '</span></div>' +
      '<div class="pf-note">示例来自 Markdown 文档。' + esc(demo.note || '') + '下表标题路径列均为修复后的形式（如「6. 监控与告警」不再重复计数）。</div>' +
    '</div>';
  }

  function renderChunksTab() {
    var panelEl = document.getElementById('panel-chunks');
    var tableEl = document.getElementById('chunks-table');
    var pgEl = document.getElementById('chunks-pagination');
    var fixEl = document.getElementById('chunks-fix');
    // 清理此前插入的占位提示（失败/处理中/空态分支会重新插入）
    Array.prototype.slice.call(panelEl.querySelectorAll(':scope > .alert, :scope > .empty-state')).forEach(function (n) { n.remove(); });
    fixEl.innerHTML = '';
    var chunks = currentChunks();

    if (doc.status === 'failed') {
      tableEl.style.display = 'none'; pgEl.style.display = 'none';
      tableEl.insertAdjacentHTML('beforebegin',
        '<div class="alert alert-error">处理失败（' + esc(doc.stage) + '阶段），暂无分块结果。失败原因与重试入口见「解析文本」页签。</div>');
      return;
    }
    if (doc.status !== 'completed') {
      tableEl.style.display = 'none'; pgEl.style.display = 'none';
      var label = MockUtil.statusMeta(doc.status).label;
      tableEl.insertAdjacentHTML('beforebegin',
        '<div class="alert alert-info">' + (doc.status === 'queued' ? '排队中，尚未生成分块。' : '处理进行中（当前阶段：' + label + '），完成后可在此预览分块结果。') + '</div>');
      return;
    }
    if (!chunks.length) {
      tableEl.style.display = 'none'; pgEl.style.display = 'none';
      tableEl.insertAdjacentHTML('beforebegin',
        '<div class="empty-state"><div class="t">暂无分块数据</div><div class="d">原型未为该文档预置分块演示数据（仅部分文档含完整分块），不代表产品能力缺失。</div></div>');
      return;
    }

    tableEl.style.display = ''; pgEl.style.display = '';
    fixEl.innerHTML = pathFixHTML();

    var total = chunks.length;
    var totalPages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * state.pageSize;
    var pageItems = chunks.slice(start, start + state.pageSize);
    var isPdf = doc.format === 'pdf';

    var rows = pageItems.map(function (c) {
      var open = !!state.expanded[c.id];
      var pageCell = isPdf ? (c.page != null ? c.page : '—') : '—';
      var summary = c.text.length > 64 ? c.text.slice(0, 64) + '…' : c.text;
      var html =
        '<tr data-chunk="' + esc(c.id) + '" class="' + (open ? 'expanded' : '') + '" aria-expanded="' + open + '">' +
          '<td class="num" style="width:88px"><button class="icon-btn exp-btn" aria-label="' + (open ? '收起' : '展开') + '第 ' + c.seq + ' 块内容" aria-expanded="' + open + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>' +
          '</button><span style="font-variant-numeric:tabular-nums">' + c.seq + '</span></td>' +
          '<td class="td-title"><div class="truncate" title="' + esc(c.titlePath) + '">' + esc(c.titlePath) + '</div></td>' +
          '<td class="td-center num" style="width:64px">' + pageCell + '</td>' +
          '<td class="num" style="width:80px">' + c.chars + '</td>' +
          '<td><div class="truncate">' + esc(summary) + '</div></td>' +
        '</tr>';
      if (open) {
        html += '<tr class="detail-tr"><td colspan="5"><div class="chunk-full">' + esc(c.text) + '</div></td></tr>';
      }
      return html;
    }).join('');

    tableEl.innerHTML =
      '<table class="table">' +
        '<thead><tr>' +
          '<th style="width:88px">序号</th><th>标题路径</th>' +
          '<th class="th-center" style="width:64px">页码</th>' +
          '<th class="num" style="width:80px">字符数</th><th>内容摘要</th>' +
        '</tr></thead>' +
        '<tbody>' + (rows || '<tr class="table-empty-row"><td colspan="5">本页无数据</td></tr>') + '</tbody>' +
      '</table>';

    SupieUI.renderPagination(pgEl, {
      total: total, page: state.page, pageSize: state.pageSize,
      onPage: function (p) { state.page = p; renderChunksTab(); },
      onPageSize: function (s) { state.pageSize = s; state.page = 1; renderChunksTab(); }
    });
  }

  // 一次性全局监听：More 菜单开合、分块行点击（表格元素会随页头重渲染重建，不能用一次性元素绑定）
  function bindGlobalEvents() {
    document.addEventListener('click', function (e) {
      var moreBtn = document.getElementById('more-btn');
      var menu = document.getElementById('more-menu');
      if (menu && !menu.hidden && !moreBtn.contains(e.target)) {
        menu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false');
      }
      var tr = e.target.closest && e.target.closest('tr[data-chunk]');
      if (tr && document.getElementById('chunks-table') && document.getElementById('chunks-table').contains(tr)) {
        var id = tr.getAttribute('data-chunk');
        state.expanded[id] = !state.expanded[id];
        renderChunksTab();
        if (state.expanded[id]) {
          var again = document.querySelector('tr[data-chunk="' + id + '"]');
          if (again) again.scrollIntoView({ block: 'nearest' });
        }
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var moreBtn = document.getElementById('more-btn');
      var menu = document.getElementById('more-menu');
      if (menu && !menu.hidden) {
        menu.hidden = true;
        if (moreBtn) { moreBtn.setAttribute('aria-expanded', 'false'); moreBtn.focus(); }
      }
    });
  }

  function focusChunk(chunkId) {
    var chunks = currentChunks();
    var idx = chunks.findIndex(function (c) { return c.id === chunkId; });
    if (idx < 0) {
      if (chunks.length) SupieUI.toast('未找到引用的分块，已显示第 1 页');
      return;
    }
    showTab('chunks');
    state.page = Math.floor(idx / state.pageSize) + 1;
    renderChunksTab();
    setTimeout(function () {
      var tr = document.querySelector('tr[data-chunk="' + chunkId + '"]');
      if (!tr) return;
      tr.scrollIntoView({ block: 'center' });
      tr.classList.add('chunk-hl');
      setTimeout(function () { tr.classList.remove('chunk-hl'); }, 2400);
    }, 60);
  }

  /* ---------- Tab 3：基本信息 ---------- */
  function strategyInfo() {
    if (doc.chunkStrategy === 'structure') {
      return { name: '按标题结构切分', note: '按文档标题层级切分，保持同一段落语义完整；单块超过最大长度时再按长度截断。' };
    }
    return { name: '按长度切分 + 重叠', note: '按固定字符长度切分并保留重叠字符，避免句子被切断后丢失上下文。' };
  }

  function stageRecordHTML() {
    var rec = stageRecord();
    return '<ol class="stage-record">' + rec.map(function (r) {
      if (r.st === 'done') {
        return '<li class="done"><span class="st-ic">✓</span><span class="st-body">' + r.name +
          '<span class="st-time">' + r.time + '</span></span></li>';
      }
      if (r.st === 'running') {
        return '<li class="running"><span class="st-ic"><span class="spinner"></span></span><span class="st-body">' + r.name + ' · 进行中</span></li>';
      }
      if (r.st === 'fail') {
        return '<li class="fail"><span class="st-ic">✕</span><span class="st-body">' + r.name + ' · 失败' +
          '<div class="st-note">' + esc(r.note) + '</div></span></li>';
      }
      return '<li class="pending"><span class="st-ic">·</span><span class="st-body">' + r.name + ' · 等待前序阶段完成</span></li>';
    }).join('') + '</ol>';
  }

  function corpusFingerprintHTML() {
    var fp = MockData.evalCorpusFingerprint;
    if (!fp) return '';
    return '<div class="info-section"><h2>语料指纹（评测可比性）</h2><dl class="kv">' +
        '<dt>文档数</dt><dd>' + fp.docCount + ' 篇</dd>' +
        '<dt>分块数</dt><dd>' + fp.chunkCount + ' 块</dd>' +
        '<dt>分块策略</dt><dd class="fp-mono">' + esc(fp.chunkStrategy) + '</dd>' +
      '</dl>' +
      '<div class="strategy-note">评测运行会记录同一份语料指纹；两次运行的文档数、分块数或分块策略不一致时判为不可比，避免把语料变化误读为检索效果提升。</div>' +
    '</div>';
  }

  function renderInfoTab() {
    var el = document.getElementById('panel-info');
    var st = strategyInfo();
    var chunkDisplay = doc.chunkCount > 0 ? doc.chunkCount + ' 块' : '—';
    el.innerHTML =
      '<div class="info-section"><h2>文件信息</h2><dl class="dl">' +
        '<dt>文件哈希</dt><dd class="mono">' + esc(doc.hash) + '</dd>' +
        '<dt>格式</dt><dd>' + esc(doc.format.toUpperCase()) + '</dd>' +
        '<dt>大小</dt><dd>' + fmtSize(doc.sizeKB) + '</dd>' +
        '<dt>上传时间</dt><dd>' + esc(doc.uploadedAt) + '</dd>' +
        '<dt>所属知识库</dt><dd><a href="docs.html?kb=' + encodeURIComponent(kbId) + '">' + esc(kbName()) + '</a></dd>' +
        '<dt>重试次数</dt><dd>' + doc.retries + ' 次</dd>' +
      '</dl></div>' +
      '<div class="info-section"><h2>分块策略</h2><dl class="dl">' +
        '<dt>策略</dt><dd>' + st.name + '<div class="strategy-note">' + st.note + '</div></dd>' +
        '<dt>已生成分块</dt><dd>' + chunkDisplay + '</dd>' +
      '</dl></div>' +
      corpusFingerprintHTML() +
      '<div class="info-section"><h2>入库任务记录</h2>' + stageRecordHTML() + '</div>';
  }

  /* ---------- 操作：重试 / 删除 ---------- */
  function onRetry() {
    if (doc.status !== 'failed') return;
    var failedAt = Math.max(0, SEQ.indexOf(doc.stage));
    doc.retries += 1;
    doc._retryBase = Date.now();
    doc.failureReason = null;
    SupieUI.toast('已重新提交处理任务', 'success');
    doc.status = 'queued'; doc.stage = '排队中'; doc.progressDone = []; doc.progressCurrent = null;
    renderHeader();

    var seqStatus = ['parsing', 'cleaning', 'chunking', 'embedding', 'indexing'];
    var i = 0;
    var tick = function () {
      if (i < seqStatus.length) {
        // 已完成过的阶段快速复用带过，失败阶段及其后放慢展示
        var delay = i < failedAt ? 500 : 1300;
        doc.status = seqStatus[i]; doc.stage = SEQ[i];
        doc.progressDone = SEQ.slice(0, i); doc.progressCurrent = SEQ[i];
        i += 1;
        renderHeader();
        setTimeout(tick, delay);
      } else {
        doc.status = 'completed'; doc.stage = null; doc.progressCurrent = null;
        doc.progressDone = SEQ.slice();
        renderHeader();
        SupieUI.toast('文档处理完成', 'success');
      }
    };
    setTimeout(tick, 900);
  }

  function onDelete() {
    var menu = document.getElementById('more-menu');
    if (menu) menu.hidden = true;
    var impacts = [];
    if (doc.chunkCount > 0) impacts.push('<li>该文档的 ' + doc.chunkCount + ' 个分块及对应向量将从检索中移除</li>');
    else impacts.push('<li>该文档已生成的分块与向量（如有）将从检索中移除</li>');
    impacts.push('<li>已有回答中引用该文档的分块将失效</li>');
    impacts.push('<li>解析文本与文件记录将被清除，此操作不可恢复</li>');
    SupieUI.confirmDanger({
      title: '删除文档',
      html: '<div class="alert alert-warning">删除后该文档将从知识库「' + esc(kbName()) + '」中移除。</div>' +
            '<ul class="impact-list">' + impacts.join('') + '</ul>',
      confirmText: '删除',
      onConfirm: function () {
        SupieUI.toast('文档已删除（演示：仅影响当前页面内存）', 'success');
        setTimeout(function () { location.href = 'docs.html?kb=' + encodeURIComponent(kbId); }, 700);
      }
    });
  }

  /* ---------- 长内容演示 ---------- */
  function toggleLong(e) {
    state.demoLong = !state.demoLong;
    if (e && e.target) e.target.textContent = state.demoLong ? '关闭' : '开启';
    if (state.demoLong && !MockUtil.chunksOf(doc.id).length) {
      SupieUI.toast('当前文档无分块演示数据，长内容样例不适用');
      state.demoLong = !state.demoLong;
      if (e && e.target) e.target.textContent = '开启';
      return;
    }
    state.page = 1;
    renderActiveTab();
  }

  function replayLoading() {
    showLoading();
    setTimeout(function () { renderHeader(); if (chunkParam) focusChunk(chunkParam); }, 800);
  }

  /* ---------- 初始化 ---------- */
  SupieUI.initShell('kb');
  bindGlobalEvents();

  if (!doc) {
    renderErrorState();
  } else {
    showLoading();
    setTimeout(function () {
      renderHeader();
      if (chunkParam) focusChunk(chunkParam);
    }, 600);
  }

  SupieUI.initProtoTools([
    { label: '长内容样例（截断/换行）', control: { type: 'button', text: '开启', onClick: toggleLong } },
    { label: '重新演示加载过程', control: { type: 'button', text: '重放 loading', onClick: replayLoading } }
  ]);
})();
</script>
</body>
</html>
